# Chạy local và trên VM: pnpm up (hoặc docker compose -f infra/docker-compose.yml up -d --build)
# Secret thật lấy qua Doppler: doppler run -- docker compose -f infra/docker-compose.yml up -d
name: jobhunt

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobhunt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobhunt}
      POSTGRES_DB: jobhunt
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunt"]
      interval: 5s
      retries: 10

  nats:
    image: nats:2-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    volumes: [natsdata:/data]

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    environment:
      PORT: 3000
      DATABASE_URL: postgres://jobhunt:${POSTGRES_PASSWORD:-jobhunt}@postgres:5432/jobhunt
      NATS_URL: nats://nats:4222
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_started }

  dashboard:
    build: { context: .., dockerfile: apps/dashboard/Dockerfile }
    ports: ["3001:3001"]
    depends_on: [api]

volumes:
  pgdata:
  natsdata:
